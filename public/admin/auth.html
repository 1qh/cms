<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <style>
      body { font-family: system-ui; display: grid; place-items: center; min-height: 100dvh; margin: 0; background: #fafafa; }
      form { display: flex; flex-direction: column; gap: 1rem; width: 280px; }
      input { padding: 0.5rem; font-size: 1rem; border: 1px solid #ddd; border-radius: 0.375rem; }
      button { padding: 0.5rem; font-size: 1rem; background: #111; color: #fff; border: none; border-radius: 0.375rem; cursor: pointer; }
      .error { color: #e11; font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <form id="f">
      <input type="password" id="p" placeholder="Mật khẩu" autofocus required />
      <button type="submit">Đăng nhập</button>
      <p class="error" id="e" hidden>Sai mật khẩu</p>
    </form>
    <script>
      document.getElementById('f').onsubmit = async (e) => {
        e.preventDefault()
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('p').value }),
        })
        if (res.ok) {
          const { token } = await res.json()
          window.opener.postMessage(
            'authorization:github:success:' + JSON.stringify({ token, provider: 'github' }),
            window.location.origin
          )
          window.close()
        } else {
          document.getElementById('e').hidden = false
        }
      }
    </script>
  </body>
</html>
