<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin</title>
    <style>
      body { font-family: system-ui; margin: 0; }
      #gate { display: grid; place-items: center; min-height: 100dvh; background: #fafafa; }
      form { display: flex; flex-direction: column; gap: 1rem; width: 280px; }
      input { padding: 0.5rem; font-size: 1rem; border: 1px solid #ddd; border-radius: 0.375rem; }
      button { padding: 0.5rem; font-size: 1rem; background: #111; color: #fff; border: none; border-radius: 0.375rem; cursor: pointer; }
      .error { color: #e11; font-size: 0.875rem; display: none; }
    </style>
    <script>window.CMS_MANUAL_INIT = true</script>
  </head>
  <body>
    <div id="gate">
      <form id="f">
        <input type="password" id="p" placeholder="Mật khẩu" autofocus required />
        <button type="submit">Đăng nhập</button>
        <p class="error" id="e">Sai mật khẩu</p>
      </form>
    </div>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      var collections = [
        { name: 'tin-tuc', label: 'Tin tức', folder: 'public/content/tin-tuc', create: true, slug: '{{year}}-{{month}}-{{day}}-{{slug}}', path: '{{slug}}/index', media_folder: '', public_folder: '', fields: [{ name: 'title', widget: 'string', label: 'Tiêu đề' }, { name: 'body', widget: 'markdown', label: 'Nội dung' }] },
        { name: 'thong-tin', label: 'Thông tin', folder: 'public/content/thong-tin', create: true, slug: '{{year}}-{{month}}-{{day}}-{{slug}}', path: '{{slug}}/index', media_folder: '', public_folder: '', fields: [{ name: 'title', widget: 'string', label: 'Tiêu đề' }, { name: 'body', widget: 'markdown', label: 'Nội dung' }] },
        { name: 'hoat-dong-dong-ho', label: 'Hoạt động dòng họ', folder: 'public/content/hoat-dong-dong-ho', create: true, slug: '{{year}}-{{month}}-{{day}}-{{slug}}', path: '{{slug}}/index', media_folder: '', public_folder: '', fields: [{ name: 'title', widget: 'string', label: 'Tiêu đề' }, { name: 'body', widget: 'markdown', label: 'Nội dung' }] },
        { name: 'lich-su-dong-ho', label: 'Lịch sử dòng họ', folder: 'public/content/lich-su-dong-ho', create: true, slug: '{{year}}-{{month}}-{{day}}-{{slug}}', path: '{{slug}}/index', media_folder: '', public_folder: '', fields: [{ name: 'title', widget: 'string', label: 'Tiêu đề' }, { name: 'body', widget: 'markdown', label: 'Nội dung' }] },
        { name: 'danh-nhan-ho-lai', label: 'Danh nhân họ Lại', folder: 'public/content/danh-nhan-ho-lai', create: true, slug: '{{year}}-{{month}}-{{day}}-{{slug}}', path: '{{slug}}/index', media_folder: '', public_folder: '', fields: [{ name: 'title', widget: 'string', label: 'Tiêu đề' }, { name: 'body', widget: 'markdown', label: 'Nội dung' }] },
        { name: 'hoat-dong-cac-chi-ho', label: 'Hoạt động các chi họ', folder: 'public/content/hoat-dong-cac-chi-ho', create: true, slug: '{{year}}-{{month}}-{{day}}-{{slug}}', path: '{{slug}}/index', media_folder: '', public_folder: '', fields: [{ name: 'title', widget: 'string', label: 'Tiêu đề' }, { name: 'body', widget: 'markdown', label: 'Nội dung' }] },
        { name: 'hoi-dong-gia-toc-ho-lai', label: 'Hội đồng gia tộc họ Lại', folder: 'public/content/hoi-dong-gia-toc-ho-lai', create: true, slug: '{{year}}-{{month}}-{{day}}-{{slug}}', path: '{{slug}}/index', media_folder: '', public_folder: '', fields: [{ name: 'title', widget: 'string', label: 'Tiêu đề' }, { name: 'body', widget: 'markdown', label: 'Nội dung' }] },
        { name: 'hoi-doanh-nhan-lai-viet', label: 'Hội Doanh nhân Lại Việt', folder: 'public/content/hoi-doanh-nhan-lai-viet', create: true, slug: '{{year}}-{{month}}-{{day}}-{{slug}}', path: '{{slug}}/index', media_folder: '', public_folder: '', fields: [{ name: 'title', widget: 'string', label: 'Tiêu đề' }, { name: 'body', widget: 'markdown', label: 'Nội dung' }] },
        { name: 'khuyen-hoc-khuyen-tai', label: 'Khuyến học - Khuyến Tài', folder: 'public/content/khuyen-hoc-khuyen-tai', create: true, slug: '{{year}}-{{month}}-{{day}}-{{slug}}', path: '{{slug}}/index', media_folder: '', public_folder: '', fields: [{ name: 'title', widget: 'string', label: 'Tiêu đề' }, { name: 'body', widget: 'markdown', label: 'Nội dung' }] },
        { name: 'nha-tho-ho-lai', label: 'Nhà thờ họ Lại', folder: 'public/content/nha-tho-ho-lai', create: true, slug: '{{year}}-{{month}}-{{day}}-{{slug}}', path: '{{slug}}/index', media_folder: '', public_folder: '', fields: [{ name: 'title', widget: 'string', label: 'Tiêu đề' }, { name: 'body', widget: 'markdown', label: 'Nội dung' }] },
        { name: 'tai-lieu-dong-ho', label: 'Tài liệu tham khảo', folder: 'public/content/tai-lieu-dong-ho', create: true, slug: '{{year}}-{{month}}-{{day}}-{{slug}}', path: '{{slug}}/index', media_folder: '', public_folder: '', fields: [{ name: 'title', widget: 'string', label: 'Tiêu đề' }, { name: 'body', widget: 'markdown', label: 'Nội dung' }] },
        { name: 'van-hoa-nghe-thuat', label: 'Văn hóa - Nghệ Thuật', folder: 'public/content/van-hoa-nghe-thuat', create: true, slug: '{{year}}-{{month}}-{{day}}-{{slug}}', path: '{{slug}}/index', media_folder: '', public_folder: '', fields: [{ name: 'title', widget: 'string', label: 'Tiêu đề' }, { name: 'body', widget: 'markdown', label: 'Nội dung' }] },
        { name: 'giay-moi', label: 'Giấy mời', folder: 'public/content/giay-moi', create: true, slug: '{{year}}-{{month}}-{{day}}-{{slug}}', path: '{{slug}}/index', media_folder: '', public_folder: '', fields: [{ name: 'title', widget: 'string', label: 'Tiêu đề' }, { name: 'body', widget: 'markdown', label: 'Nội dung' }] },
        { name: 'ho-lai-ngay-nay', label: 'Họ Lại ngày nay', folder: 'public/content/ho-lai-ngay-nay', create: true, slug: '{{year}}-{{month}}-{{day}}-{{slug}}', path: '{{slug}}/index', media_folder: '', public_folder: '', fields: [{ name: 'title', widget: 'string', label: 'Tiêu đề' }, { name: 'body', widget: 'markdown', label: 'Nội dung' }] },
        { name: 'ban-lien-lac-con-chau-ho-lai-viet-nam', label: 'Ban liên lạc con cháu họ Lại VN', folder: 'public/content/ban-lien-lac-con-chau-ho-lai-viet-nam', create: true, slug: '{{year}}-{{month}}-{{day}}-{{slug}}', path: '{{slug}}/index', media_folder: '', public_folder: '', fields: [{ name: 'title', widget: 'string', label: 'Tiêu đề' }, { name: 'body', widget: 'markdown', label: 'Nội dung' }] },
        { name: 'about', label: 'Giới thiệu', folder: 'public/content/about', create: true, slug: '{{year}}-{{month}}-{{day}}-{{slug}}', path: '{{slug}}/index', media_folder: '', public_folder: '', fields: [{ name: 'title', widget: 'string', label: 'Tiêu đề' }, { name: 'body', widget: 'markdown', label: 'Nội dung' }] },
      ]

      document.getElementById('f').onsubmit = async function(e) {
        e.preventDefault()
        var res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('p').value }),
        })
        if (res.ok) {
          var data = await res.json()
          document.getElementById('gate').remove()
          window.CMS.init({
            config: {
              backend: {
                name: 'github',
                repo: '1qh/cms',
                branch: 'main',
                api_root: 'https://api.github.com',
                auth_type: 'token',
                token: data.token,
              },
              media_folder: 'public/content',
              public_folder: '/content',
              collections: collections,
            },
          })
        } else {
          document.getElementById('e').style.display = 'block'
        }
      }
    </script>
  </body>
</html>
